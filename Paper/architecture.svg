<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%" style="background: #0B0F19; font-family: system-ui, -apple-system, sans-serif;">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background grid pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.7" opacity="0.6"/>
    </pattern>

    <!-- Glowing Linear Gradients -->
    <linearGradient id="grad-input" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="grad-symbolic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="grad-neural" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <linearGradient id="grad-orchestrator" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="grad-output" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>

    <!-- Path Gradients -->
    <linearGradient id="grad-path-sym" x1="0%" y1="50%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="grad-path-neu" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="grad-path-merge-sym" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="grad-path-merge-neu" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Dropshadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <filter id="glow-sym" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="#0B0F19"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Glowing background blobs -->
  <circle cx="200" cy="220" r="150" fill="#3B82F6" opacity="0.08" filter="url(#glow-sym)"/>
  <circle cx="480" cy="120" r="120" fill="#10B981" opacity="0.06" filter="url(#glow-sym)"/>
  <circle cx="480" cy="320" r="120" fill="#8B5CF6" opacity="0.06" filter="url(#glow-sym)"/>
  <circle cx="740" cy="220" r="130" fill="#06B6D4" opacity="0.08" filter="url(#glow-sym)"/>

  <!-- ==================== CONNECTIONS / FLOW LINES ==================== -->
  
  <!-- Input to Symbolic Path (Curve) -->
  <path d="M 230 220 C 280 220, 300 120, 370 120" fill="none" stroke="url(#grad-path-sym)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <circle cx="300" cy="170" r="4" fill="#10B981">
    <animate attributeName="cx" values="230;370" dur="4s" repeatCount="indefinite" />
    <animate attributeName="cy" values="220;120" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- Input to Neural Path (Curve) -->
  <path d="M 230 220 C 280 220, 300 320, 370 320" fill="none" stroke="url(#grad-path-neu)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <circle cx="300" cy="270" r="4" fill="#8B5CF6">
    <animate attributeName="cx" values="230;370" dur="4s" repeatCount="indefinite" />
    <animate attributeName="cy" values="220;320" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- Symbolic to Orchestrator Path -->
  <path d="M 530 120 C 600 120, 610 220, 660 220" fill="none" stroke="url(#grad-path-merge-sym)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  
  <!-- Neural to Orchestrator Path -->
  <path d="M 530 320 C 600 320, 610 220, 660 220" fill="none" stroke="url(#grad-path-merge-neu)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

  <!-- Orchestrator to Output Path -->
  <line x1="770" y1="220" x2="800" y2="220" stroke="#06B6D4" stroke-width="3" opacity="0.85"/>
  
  <!-- ==================== NODES / CARDS ==================== -->

  <!-- 1. Input Node -->
  <g transform="translate(40, 160)" filter="url(#shadow)">
    <rect width="190" height="120" rx="14" fill="#1E293B" stroke="url(#grad-input)" stroke-width="2"/>
    <rect width="190" height="120" rx="14" fill="#3B82F6" opacity="0.05"/>
    <text x="20" y="35" fill="#3B82F6" font-size="12" font-weight="bold" letter-spacing="1">INPUT SYSTEM</text>
    <text x="20" y="60" fill="#F8FAFC" font-size="16" font-weight="bold">Conversational Text</text>
    <text x="20" y="82" fill="#94A3B8" font-size="12">Narrative &amp; Kinship Query</text>
    <text x="20" y="98" fill="#64748B" font-size="11">Algorithm 1 State Tracking</text>
  </g>

  <!-- 2. Symbolic Node (Top Branch) -->
  <g transform="translate(370, 60)" filter="url(#shadow)">
    <rect width="180" height="120" rx="14" fill="#1E293B" stroke="url(#grad-symbolic)" stroke-width="2"/>
    <rect width="180" height="120" rx="14" fill="#10B981" opacity="0.05"/>
    <!-- Animated pulse ring -->
    <rect width="180" height="120" rx="14" fill="none" stroke="#10B981" stroke-width="1" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="1;3;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="18" y="32" fill="#10B981" font-size="11" font-weight="bold" letter-spacing="1">SYMBOLIC ENGINE</text>
    <text x="18" y="55" fill="#F8FAFC" font-size="15" font-weight="bold">Forward Chaining</text>
    <text x="18" y="76" fill="#94A3B8" font-size="11">47 FOL Horn Clauses</text>
    <text x="18" y="92" fill="#94A3B8" font-size="11">Dynamic Inverse Maps</text>
    <text x="18" y="108" fill="#34D399" font-size="11" font-weight="600">Accuracy: 100% (Strict)</text>
  </g>

  <!-- 3. Neural Node (Bottom Branch) -->
  <g transform="translate(370, 260)" filter="url(#shadow)">
    <rect width="180" height="120" rx="14" fill="#1E293B" stroke="url(#grad-neural)" stroke-width="2"/>
    <rect width="180" height="120" rx="14" fill="#8B5CF6" opacity="0.05"/>
    <text x="18" y="32" fill="#A78BFA" font-size="11" font-weight="bold" letter-spacing="1">NEURAL FALLBACK</text>
    <text x="18" y="55" fill="#F8FAFC" font-size="15" font-weight="bold">BERT Encoder</text>
    <text x="18" y="76" fill="#94A3B8" font-size="11">Relational Classifier</text>
    <text x="18" y="92" fill="#94A3B8" font-size="11">Softmax Distribution</text>
    <text x="18" y="108" fill="#C084FC" font-size="11" font-weight="600">Threshold: τ = 0.8</text>
  </g>

  <!-- 4. Orchestrator Node (Merge) -->
  <g transform="translate(640, 160)" filter="url(#shadow)">
    <polygon points="0,60 55,0 110,60 55,120" fill="#1E293B" stroke="url(#grad-orchestrator)" stroke-width="2.5"/>
    <polygon points="0,60 55,0 110,60 55,120" fill="#F59E0B" opacity="0.05"/>
    
    <text x="55" y="48" fill="#F59E0B" font-size="11" font-weight="bold" letter-spacing="0.5" text-anchor="middle">DECISION</text>
    <text x="55" y="68" fill="#F8FAFC" font-size="14" font-weight="bold" text-anchor="middle">ROUTER</text>
    <text x="55" y="85" fill="#94A3B8" font-size="10" text-anchor="middle">Algorithm 3</text>
  </g>

  <!-- 5. Output Card -->
  <g transform="translate(800, 160)" filter="url(#shadow)">
    <!-- Little arrow connector -->
    <path d="M -30 60 L 0 60" stroke="#06B6D4" stroke-width="3"/>
    
    <rect width="60" height="120" rx="10" fill="#1E293B" stroke="url(#grad-output)" stroke-width="2"/>
    <rect width="60" height="120" rx="10" fill="#06B6D4" opacity="0.05"/>
    
    <!-- Rotated typography to look sleek -->
    <text x="-60" y="35" transform="rotate(-90)" fill="#F8FAFC" font-size="15" font-weight="bold" text-anchor="middle">OUTPUT</text>
  </g>
</svg>
